name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # needed to create releases and upload assets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # don't cancel in-flight releases

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: "Release (${{ matrix.target }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            archive-ext: tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            archive-ext: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            archive-ext: tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            archive-ext: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            archive-ext: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            archive-ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          EXT="${{ matrix.archive-ext }}"

          # Binary name differs on Windows
          if [[ "$TARGET" == *windows* ]]; then
            BIN="target/${TARGET}/release/ripr.exe"
          else
            BIN="target/${TARGET}/release/ripr"
          fi

          # Strip binary on native non-Windows builds
          if [[ "${{ matrix.cross }}" != "true" && "$TARGET" != *windows* ]]; then
            strip "$BIN"
          fi

          # Archive name
          ARCHIVE="ripr-${VERSION}-${TARGET}.${EXT}"

          if [[ "$EXT" == "zip" ]]; then
            7z a "$ARCHIVE" "$BIN"
          else
            tar -czf "$ARCHIVE" -C "$(dirname $BIN)" "$(basename $BIN)"
          fi

          # SHA256
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sha256 }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
